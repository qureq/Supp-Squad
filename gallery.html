<style>
.card-desc {
    /* Твои старые стили (шрифт, цвет и т.д.) остаются тут */

}
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:url('background.png') center center/cover fixed no-repeat;
min-height:100vh;
overflow-x:hidden;
color:white;
position:relative;
}

body::before{
content:'';
position:fixed;
inset:0;
background:rgba(0,0,0,.10);
z-index:0;
}

/* ВЕРХНЕЕ ОБЛАЧКО (GLOW EFFECT) */
.top-cloud {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
    filter: blur(80px);
    -webkit-filter: blur(80px);
    z-index: 1;
    pointer-events: none;
    animation: pulseCloud 8s ease-in-out infinite alternate;
}

@keyframes pulseCloud {
    0% { opacity: 0.7; transform: translateX(-50%) scale(1); }
    100% { opacity: 1; transform: translateX(-50%) scale(1.15); }
}

/* NAVBAR (ПОЛНОСТЬЮ ИЗ INDEX.HTML С КНОПКОЙ) */
.navbar{
    position:absolute;
    top:24px;
    left:24px;
    right:24px;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.16);
    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 10px 40px rgba(0,0,0,0.12);
    z-index:50;
}

.nav-left{
    display:flex;
    align-items:center;
    gap:16px;
}

.nav-left img{
    width:34px;
    height:34px;
    object-fit:contain;
}

.nav-left span{
    font-size:18px;
    font-weight:500;
}

.nav-center{
    display:flex;
    gap:72px;
}

.nav-center a{
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:500;
    opacity:0.96;
    transition: 0.2s ease;
}
.nav-center a:hover{ opacity:1; transform:translateY(-1px); }

.discord-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    min-width:230px;
    height:50px;
    border-radius:18px;
    background:#6db26f;
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    0 10px 30px rgba(109,178,111,0.25);
    transition:0.2s ease;
}

.discord-btn:hover{ transform:translateY(-2px); }
.discord-btn img{ width:24px; height:24px; }

/* PAGE CONTAINER */
.page{
position:relative;
z-index:2;
padding-top:160px;
padding-bottom:80px;
width:min(1300px,92%);
margin:auto;
}

.page-title{ font-size:64px; font-weight:800; letter-spacing:-3px; margin-bottom:14px; }
.page-sub{ font-size:20px; opacity:.9; margin-bottom:48px; }

/* СЕТКА ГАЛЕРЕИ */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
}

/* КАРТОЧКА С РОСКОШНЫМ ЗАДНИМ БЛЮРОМ */
.gallery-item {
    position: relative;
    overflow: hidden;
    height: 320px;
    border-radius: 28px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.14);
    transition: transform .25s cubic-bezier(0.4, 0, 0.2, 1), border-color .25s;
    cursor: pointer;
}

.gallery-item:hover {
    transform: translateY(-5px);
    border-color: rgba(255, 255, 255, 0.35);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* ПСЕВДОЭЛЕМЕНТ ДЛЯ КРАСИВОГО РАЗМЫТОГО ЗАДНЕГО ФОНА */
.gallery-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: var(--bg-img);
    background-size: cover;
    background-position: center;
    filter: blur(20px) brightness(0.6);
    transform: scale(1.15); /* Убираем белые края размытия */
    z-index: 1;
    pointer-events: none;
}

/* САМА КАРТИНКА ПО ЦЕНТРУ — ВИДНО ВСЮ СУТЬ И ТЕКСТ */
.gallery-item img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain; /* Картинка теперь влезает полностью, без обрезки! */
    padding: 10px 10px 55px 10px; /* Оставляем место снизу под текст */
    z-index: 2;
    display: block;
}

/* Видео на всю плитку */
.gallery-item .gallery-video {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
    display: block;
    border: none;
}

.video-click-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: transparent;
}

/* ТГ-СПОЙЛЕР */
.tg-blur-overlay {
    position: absolute;
    inset: 0; 
    background: rgba(20, 20, 20, 0.55); 
    backdrop-filter: blur(35px) brightness(0.6);
    -webkit-backdrop-filter: blur(35px) brightness(0.6);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    user-select: none;
}

.tg-blur-overlay::after {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.18;
    background-image: radial-gradient(rgba(255, 255, 255, 0.9) 1px, transparent 1px);
    background-size: 4px 4px;
    z-index: 1;
}

.tg-blur-overlay::before {
    content: '👁‍🗨';
    font-size: 36px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
}

.gallery-item.revealed .tg-blur-overlay {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
}

/* ОБНОВЛЕННЫЙ СТИЛЬНЫЙ ОВЕРЛЕЙ ОПИСАНИЯ */
.gallery-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 16px 20px;
    /* Размытие стекла специально под текстом */
    background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 4;
    pointer-events: none;
    transition: opacity 0.2s;
}

.gallery-item:not(.revealed) .gallery-overlay { 
    opacity: 0; 
}

.gallery-overlay p { 
    font-size: 14px; 
    font-weight: 600;
    line-height: 1.3;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis; /* Аккуратно сокращает слишком длинный текст */
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
}

/* FOOTER */
.footer{ margin-top:60px; text-align:center; opacity:.85; font-size:14px; }

/* ТГ-ПЛЕЕР */
.viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,.96);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition: opacity 0.2s ease;
z-index:9999;
user-select: none;

.viewer.active{ opacity:1; pointer-events:auto; }
.viewer-content{ display:flex; flex-direction:column; align-items:center; gap:20px; width: 100%; max-width: 100vw; position: relative; }
#viewerMediaContainer { display: flex; align-items: center; justify-content: center; width: 100%; height: 75vh; position: relative; }

.viewer img, .viewer iframe {
max-width:95vw;
max-height:75vh;
border-radius:14px;
border: none;
box-shadow: 0 20px 50px rgba(0,0,0,0.6);

.viewer img { cursor: grab; transition: transform 0.1s ease-out; -webkit-user-drag: none; }
.viewer img.dragging { cursor: grabbing; transition: none !important; }
.viewer iframe { width: 854px; height: 480px; aspect-ratio: 16 / 9; }

.viewer-caption{ font-size:15px; font-weight: 500; text-align:center; max-width:800px; padding:0 20px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); opacity: 0.95; }

.viewer-nav{
position:absolute;
top:50%;
transform:translateY(-50%);
width:50px;
height:50px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.08);
color:white;
font-size:20px;
cursor:pointer;
z-index:10;
display: flex;
align-items: center;
justify-content: center;
transition: background 0.2s;
}
.viewer-nav:hover { background:rgba(255,255,255,.2); }
.prev{ left:40px; }
.next{ right:40px; }

@media(max-width:900px){
.navbar{ height:auto; padding:18px; flex-direction:column; gap:18px; }
.nav-center{ gap:26px; }
.page-title{ font-size:42px; }
.gallery-grid{ grid-template-columns:1fr; gap: 16px; }
.gallery-item { height: 280px; }
.viewer-nav { display: none; }
.viewer iframe { width: 100%; height: auto; }
}
</style>

const grid = document.getElementById('galleryGrid');

galleryData.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'gallery-item';
    
    // Передаем картинку в CSS-переменную для размытого фона плитки
    if (item.type === 'image') {
        card.style.setProperty('--bg-img', `url('${item.src}')`);
    } else {
        // Для видео ставим заглушку из темного цвета
        card.style.setProperty('--bg-img', 'none');
    }

    if (!item.blur) card.classList.add('revealed');
    card.setAttribute('data-index', index);

    let mediaHtml = '';
    if (item.type === 'image') {
        mediaHtml = `<img src="${item.src}" alt="media" loading="lazy">`;
    } else if (item.type === 'video') {
        mediaHtml = `
            <div class="video-click-overlay"></div>
            <iframe class="gallery-video" src="${item.src}?autoplay=0&mute=1&controls=0" allow="autoplay; encrypted-media"></iframe>
        `;
    }

    card.innerHTML = `
        ${item.blur ? '<div class="tg-blur-overlay"></div>' : ''}
        ${mediaHtml}
        <div class="gallery-overlay">
            <p>${item.desc}</p>
        </div>
    `;

    card.addEventListener('click', () => {
        if (!card.classList.contains('revealed')) {
            card.classList.add('revealed');
        } else {
            openViewer(index);
        }
    });

    grid.appendChild(card);
});

const viewer = document.getElementById('viewer');
const mediaContainer = document.getElementById('viewerMediaContainer');
const viewerCaption = document.getElementById('viewerCaption');
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');

let currentIndex = 0, zoom = 1, currentMediaEl = null, isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openViewer(index) {
    currentIndex = index;
    const item = galleryData[index];
    mediaContainer.innerHTML = ''; 
    zoom = 1; translateX = 0; translateY = 0;

    if (item.type === 'image') {
        currentMediaEl = document.createElement('img');
        currentMediaEl.src = item.src;
        mediaContainer.appendChild(currentMediaEl);
        initTelegramGestures(currentMediaEl, true);
    } else if (item.type === 'video') {
        currentMediaEl = document.createElement('iframe');
        currentMediaEl.src = `${item.src}?autoplay=1&controls=1`;
        currentMediaEl.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture";
        currentMediaEl.allowFullscreen = true;
        mediaContainer.appendChild(currentMediaEl);
        initTelegramGestures(currentMediaEl, false);
    }

    viewerCaption.innerHTML = `<p>${item.desc}</p>`;
    viewer.classList.add('active');
}

function initTelegramGestures(element, isImage) {
    element.style.transform = `translate(0px, 0px) scale(1)`;

    if(isImage) {
        element.addEventListener('wheel', e => {
            e.preventDefault();
            zoom += (e.deltaY < 0) ? 0.2 : -0.2;
            if (zoom < 1) { zoom = 1; translateX = 0; translateY = 0; }
            if (zoom > 5) zoom = 5;
            element.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoom})`;
        });
    }

    const startDrag = (clientX, clientY) => {
        isDragging = true;
        startX = clientX - translateX;
        startY = clientY - translateY;
        element.classList.add('dragging');
    };

    element.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
    element.addEventListener('touchstart', e => { if(e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY); });

    const moveDrag = (clientX, clientY) => {
        if (!isDragging) return;
        translateX = clientX - startX;
        translateY = clientY - startY;

        if (zoom === 1) {
            const opacityRatio = Math.max(0.3, 1 - Math.abs(translateY) / 600);
            viewer.style.backgroundColor = `rgba(0, 0, 0, ${opacityRatio * 0.96})`;
        }
        element.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoom})`;
    };

    document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    document.addEventListener('touchmove', e => { if(isDragging && e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});

    const stopDrag = () => {
        if (!isDragging) return;
        isDragging = false;
        element.classList.remove('dragging');

        if (zoom === 1) {
            if (Math.abs(translateY) > 140) {
                element.style.transition = 'transform 0.2s, opacity 0.2s';
                element.style.transform = `translate(${translateX}px, ${translateY * 1.5}px) scale(0.8)`;
                element.style.opacity = '0';
                setTimeout(() => { closeViewer(); element.style.opacity = '1'; }, 200);
                return;
            }
            if (translateX > 120) { showNextMedia(-1); return; } 
            else if (translateX < -120) { showNextMedia(1); return; }
            translateX = 0; translateY = 0;
        }
        viewer.style.backgroundColor = `rgba(0, 0, 0, 0.96)`;
        element.style.transition = 'transform 0.2s ease-out';
        element.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoom})`;
        setTimeout(() => { element.style.transition = ''; }, 200);
    };

    document.addEventListener('mouseup', stopDrag);
    document.addEventListener('touchend', stopDrag);
}

function showNextMedia(offset) {
    let nextIndex = currentIndex + offset;
    if (nextIndex < 0) nextIndex = galleryData.length - 1;
    if (nextIndex >= galleryData.length) nextIndex = 0;
    if (currentMediaEl) {
        currentMediaEl.style.transition = 'transform 0.15s, opacity 0.15s';
        currentMediaEl.style.opacity = '0';
        currentMediaEl.style.transform = `translate(${offset * -60}px, 0px) scale(0.95)`;
    }
    setTimeout(() => { openViewer(nextIndex); }, 150);
}

function closeViewer() { viewer.classList.remove('active'); mediaContainer.innerHTML = ''; currentMediaEl = null; viewer.style.backgroundColor = `rgba(0, 0, 0, 0.96)`; }
prevBtn.onclick = e => { e.stopPropagation(); showNextMedia(-1); };
nextBtn.onclick = e => { e.stopPropagation(); showNextMedia(1); };
viewer.addEventListener('click', e => { if (e.target === viewer || e.target === mediaContainer) closeViewer(); });
document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('active')) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') showNextMedia(-1);
    if (e.key === 'ArrowRight') showNextMedia(1);
});
</script>
</body>
</html>
