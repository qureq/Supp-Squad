<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supp Squad</title>
<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Inter',sans-serif;
}

body{
    position:relative;
    background:url('background.png') center center/cover no-repeat;
    color:white;
}

body::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.10);
    z-index:0;
}

/* NAVBAR */
.navbar{
    position:absolute;
    top:24px;
    left:24px;
    right:24px;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 26px;

    border-radius:28px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    /* Возвращена мягкая обводка */
    border:1px solid rgba(255,255,255,0.16);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 10px 40px rgba(0,0,0,0.12);

    z-index:10;
}

.nav-left{
    display:flex;
    align-items:center;
    gap:16px;
}

.nav-left img{
    width:34px;
    height:34px;
    object-fit:contain;
}

.nav-left span{
    font-size:18px;
    font-weight:500;
}

.nav-center{
    display:flex;
    gap:72px;
}

.nav-center a{
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:500;
    opacity:0.96;
}

.discord-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    min-width:230px;
    height:50px;

    border-radius:18px;

    background:#6db26f;

    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:600;

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    0 10px 30px rgba(109,178,111,0.25);

    transition:0.2s ease;
}

.discord-btn:hover{
    transform:translateY(-2px);
}

.discord-btn img{
    width:24px;
    height:24px;
}

/* HERO AREA */
.hero{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.blob-wrapper{
    position:relative;
    width:720px;
    height:620px;
}

.blob-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.blob-content{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:40px;
}

.main-logo{
    width:110px;
    margin-bottom:26px;
    filter:drop-shadow(0 0 12px rgba(255,255,255,0.12));
}

h1{
    font-size:72px;
    line-height:1;
    font-weight:800;
    letter-spacing:-3px;
    margin-bottom:18px;
    text-shadow:0 2px 18px rgba(0,0,0,0.10);
}

.subtitle{
    font-size:19px;
    font-weight:400;
    opacity:0.96;
    margin-bottom:40px;
}

.big-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;

    width:360px;
    height:64px;

    border-radius:22px;

    background:#74b874;

    color:white;
    text-decoration:none;

    font-size:21px;
    font-weight:600;

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.14),
    0 12px 35px rgba(116,184,116,0.30);

    transition:0.2s ease;
}

.big-btn:hover{
    transform:translateY(-3px);
}

.big-btn img{
    width:32px;
}

/* НИЖНЯЯ ВОЛНА */
.bottom-wave-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 110px;
    z-index: 1;
    
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px); 
    -webkit-backdrop-filter: blur(18px);
    
    clip-path: url(#wave-clip);
}

.bottom-wave-line {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 110px;
    z-index: 2;
    pointer-events: none;
}

.footer{
    position:absolute;
    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    z-index:4;

    font-size:15px;
    opacity:0.95;
}

@media(max-width:900px){
    body{
        overflow:auto;
    }

    .navbar{
        height:auto;
        padding:18px;
        flex-direction:column;
        gap:18px;
        border:1px solid rgba(255,255,255,0.16);
    }

    .nav-center{
        gap:28px;
    }

    .blob-wrapper{
        width:94vw;
        height:540px;
    }

    h1{
        font-size:58px;
    }

    .subtitle{
        font-size:18px;
    }

    .big-btn{
        width:90%;
        font-size:18px;
    }
}
</style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <img src="logo.png" alt="logo">
        <span>Supp Squad</span>
    </div>

    <div class="nav-center">
        <a href="#">Главная</a>
        <a href="gallery.html">Галерея</a>
        <a href="rules.html">Правила</a>
    </div>

    <a href="https://discord.com/invite/cnb99GD65C" class="discord-btn">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">
        Присоединиться
    </a>
</div>

<section class="hero">
    <div class="blob-wrapper">
        <svg class="blob-svg" viewBox="0 0 720 620" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 360 70 
                     A 75 75 0 0 1 485 115 
                     A 75 75 0 0 1 595 210 
                     A 75 75 0 0 1 650 340 
                     A 75 75 0 0 1 595 470 
                     A 75 75 0 0 1 485 555 
                     A 75 75 0 0 1 360 565 
                     A 75 75 0 0 1 235 555 
                     A 75 75 0 0 1 125 470 
                     A 75 75 0 0 1 70 340 
                     A 75 75 0 0 1 125 210 
                     A 75 75 0 0 1 235 115 
                     A 75 75 0 0 1 360 70 Z"
            fill="rgba(255,255,255,0.08)"
            backdrop-filter="blur(18px)"/>

            <path d="M 360 70 
                     A 75 75 0 0 1 485 115 
                     A 75 75 0 0 1 595 210 
                     A 75 75 0 0 1 650 340 
                     A 75 75 0 0 1 595 470 
                     A 75 75 0 0 1 485 555 
                     A 75 75 0 0 1 360 565 
                     A 75 75 0 0 1 235 555 
                     A 75 75 0 0 1 125 470 
                     A 75 75 0 0 1 70 340 
                     A 75 75 0 0 1 125 210 
                     A 75 75 0 0 1 235 115 
                     A 75 75 0 0 1 360 70 Z"
            stroke="rgba(255,255,255,0.56)"
            stroke-width="1.2"/>
        </svg>

        <div class="blob-content">
            <img class="main-logo" src="logo.png" alt="logo">
            <h1>Supp Squad</h1>
            <div class="subtitle">Supp Squad - сервер друзей 💚</div>
            <a href="https://discord.com/invite/cnb99GD65C" class="big-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">
                Присоединиться к Discord
            </a>
        </div>
    </div>
</section>

<div class="bottom-wave-wrapper"></div>

<svg class="bottom-wave-line" viewBox="0 0 1440 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 25C90 10 180 45 280 40C390 35 460 5 560 5C660 5 740 38 840 43C950 48 1030 18 1130 13C1230 8 1330 30 1440 5" 
          stroke="rgba(255,255,255,0.16)" 
          stroke-width="1" 
          fill="none"/>
</svg>

<svg width="0" height="0" style="position:absolute;">
    <defs>
        <clipPath id="wave-clip" clipPathUnits="objectBoundingBox">
            <path d="M0,0.227 C0.062,0.091 0.125,0.409 0.194,0.364 C0.271,0.318 0.319,0.045 0.389,0.045 C0.458,0.045 0.514,0.345 0.583,0.391 C0.66,0.436 0.715,0.164 0.785,0.118 C0.854,0.073 0.924,0.273 1,0.045 L1,1 L0,1 Z"/>
        </clipPath>
    </defs>
</svg>

<div class="footer">
    Supp Squad Corporation
</div>

</body>
</html>
